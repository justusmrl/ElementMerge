name: Paginated Acquisition Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/paginated-acquisition-smoke.yml'
      - 'research/payload/**'
      - 'research/patches/apply_slot_anchor_patch.py'
      - 'research/patches/apply_portal_pagination_patch.py'

permissions:
  contents: read

jobs:
  paginated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct patched Phase 1 acquisition
        shell: bash
        run: |
          set -euo pipefail
          cat research/payload/part* | base64 -d | gzip -d > /tmp/acquire.py
          sed -i 's#/tmp/pumpfun_phase1_acquire.py#/tmp/acquire.py#g' research/patches/apply_slot_anchor_patch.py
          python research/patches/apply_slot_anchor_patch.py
          python research/patches/apply_portal_pagination_patch.py
          python -m py_compile /tmp/acquire.py
          sha256sum /tmp/acquire.py | tee acquisition_script.sha256
      - run: python -m pip install --quiet requests pandas pyarrow
      - name: Run one-day read-only acquisition
        shell: bash
        run: |
          set -o pipefail
          python /tmp/acquire.py acquire --shard 0 --shards 1 \
            --start-date 2026-07-23 --end-date 2026-07-24 \
            --output-dir out --metadata-workers 64 --mint-batch-size 150 \
            2>&1 | tee paginated-smoke.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paginated-acquisition-smoke-${{ github.run_id }}
          path: |
            out/
            paginated-smoke.log
            acquisition_script.sha256
          if-no-files-found: warn
          retention-days: 7
