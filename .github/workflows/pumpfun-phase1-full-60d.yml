name: Pumpfun Phase 1 Full 60d

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pumpfun-phase1-full-60d.yml'
      - 'research/payload/**'
      - 'research/patches/apply_slot_anchor_patch.py'
      - 'research/patches/apply_portal_pagination_patch.py'
      - 'research/patches/apply_followup_window_patch.py'

permissions:
  contents: read

jobs:
  acquire:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct frozen Phase 1 acquisition
        shell: bash
        run: |
          set -euo pipefail
          cat research/payload/part* | base64 -d | gzip -d > /tmp/acquire.py
          sed -i 's#/tmp/pumpfun_phase1_acquire.py#/tmp/acquire.py#g' research/patches/apply_slot_anchor_patch.py
          python research/patches/apply_slot_anchor_patch.py
          python research/patches/apply_portal_pagination_patch.py
          python research/patches/apply_followup_window_patch.py
          python -m py_compile /tmp/acquire.py
          sha256sum /tmp/acquire.py | tee acquisition-script-sha256.txt
      - run: python -m pip install --disable-pip-version-check --quiet requests pandas pyarrow
      - name: Acquire shard ${{ matrix.shard }}
        shell: bash
        run: |
          set -o pipefail
          python /tmp/acquire.py acquire \
            --shard ${{ matrix.shard }} --shards 6 \
            --start-date 2026-05-25 --end-date 2026-07-24 \
            --output-dir out --metadata-workers 64 --mint-batch-size 150 \
            2>&1 | tee phase1-shard-${{ matrix.shard }}.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            out/shard-*/
            phase1-shard-${{ matrix.shard }}.log
            acquisition-script-sha256.txt
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30

  combine:
    needs: acquire
    if: ${{ always() && needs.acquire.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct exact processing script
        shell: bash
        run: |
          set -euo pipefail
          cat research/payload/part* | base64 -d | gzip -d > /tmp/acquire.py
          sed -i 's#/tmp/pumpfun_phase1_acquire.py#/tmp/acquire.py#g' research/patches/apply_slot_anchor_patch.py
          python research/patches/apply_slot_anchor_patch.py
          python research/patches/apply_portal_pagination_patch.py
          python research/patches/apply_followup_window_patch.py
          python -m py_compile /tmp/acquire.py
      - run: python -m pip install --disable-pip-version-check --quiet requests pandas pyarrow
      - uses: actions/download-artifact@v4
        with:
          pattern: phase1-shard-*-${{ github.run_id }}
          path: downloaded-shards
          merge-multiple: false
      - name: Combine, verify, and build portable Phase 2 package
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/acquire.py combine \
            --input-root downloaded-shards \
            --output-dir phase1-final \
            --start-date 2026-05-25 --end-date 2026-07-24 \
            2>&1 | tee phase1-combine.log
          mkdir -p phase1-final/provenance
          cp .github/workflows/pumpfun-phase1-full-60d.yml phase1-final/provenance/
          cp research/patches/apply_slot_anchor_patch.py phase1-final/provenance/
          cp research/patches/apply_portal_pagination_patch.py phase1-final/provenance/
          cp research/patches/apply_followup_window_patch.py phase1-final/provenance/
          git rev-parse HEAD > phase1-final/provenance/git_commit.txt
          find phase1-final -type f -print0 | sort -z | xargs -0 sha256sum > phase1-final/provenance/postpackage_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pumpfun-phase1-60d-final-${{ github.run_id }}
          path: |
            phase1-final/
            phase1-combine.log
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
