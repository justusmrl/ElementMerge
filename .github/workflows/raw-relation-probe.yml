name: Raw SQD Relation Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/raw-relation-probe.yml'
      - 'research/raw_relation_probe.py'

permissions:
  contents: read

jobs:
  relation-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests
      - run: python research/raw_relation_probe.py | tee raw-relation-probe.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-sqd-relation-probe-${{ github.run_id }}
          path: |
            out/raw-relation-probe/
            raw-relation-probe.log
          if-no-files-found: error
          retention-days: 7
