name: Pumpfun SQD Phase 1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pumpfun-phase1-sqd.yml'
      - 'research/pumpfun_phase1_acquire.py'

permissions:
  contents: read

jobs:
  sqd-schema-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --quiet requests
      - run: python research/pumpfun_phase1_acquire.py --probe --output-dir out/phase1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pumpfun-sqd-phase1-probe-${{ github.run_id }}
          path: out/phase1/
          if-no-files-found: error
          retention-days: 7
